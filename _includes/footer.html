{%- assign footer = site.data.sitetext[site.locale].footer -%}
<footer class="site-footer on-dark">
  <div class="footer-inner wrap">
    <img src="{{ site.brand_logo.path | relative_url }}" alt="{{ site.title }}" width="{{ site.brand_logo.width }}" height="{{ site.brand_logo.height }}" loading="lazy">
    <span>{{ footer.tagline }}</span>
    <ul class="footer-links">
      {%- for link in footer.links %}
      <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
      {%- endfor %}
    </ul>
    <p class="footer-legal">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}{% if footer.company %} · {{ footer.company }}{% endif %}</p>
  </div>
</footer>
