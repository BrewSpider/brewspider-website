<!-- Contact -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].contact.section | default: "contact" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">
          {{ site.data.sitetext[site.locale].contact.title | markdownify | default: Contact Us }}</h2>
        <h3 class="section-subheading text-muted">{{ site.data.sitetext[site.locale].contact.text | default: "" }}</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <form id="contactForm"
          name="contact-brewspider" 
          action="{% if site.formspree_form_path %}{{ site.formspree_form_path }}{% endif %}"
          data-netlify="true"
          netlify-honeypot="_gotcha"
          novalidate="novalidate"
          method="POST">
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label class="sr-only" for="name">{{ site.data.sitetext[site.locale].contact.name-label | default: "Name" }}</label>
                <input name="name" class="form-control" id="name"
                  aria-describedby="name-help" type="text" autocomplete="name"
                  placeholder="{{ site.data.sitetext[site.locale].contact.name | default: "Name*" }}"
                  required="required" data-validation-required-message="{{ site.data.sitetext[site.locale].contact.name-validation | default: "Please enter your name." }}">
                <p class="help-block text-danger" id="name-help"></p>
              </div>
              <div class="form-group">
                <label class="sr-only" for="email">{{ site.data.sitetext[site.locale].contact.email-label | default: "Email" }}</label>
                <input name="_replyto" class="form-control" id="email"
                  aria-describedby="email-help" type="email" autocomplete="email"
                  placeholder="{{ site.data.sitetext[site.locale].contact.email | default: "Email*" }}"
                  required="required" data-validation-required-message="{{ site.data.sitetext[site.locale].contact.email-validation | default: "Please enter your email address." }}"
                  data-validation-invalid-message="{{ site.data.sitetext[site.locale].contact.email-invalid | default: "Please enter a valid email address." }}">
                <p class="help-block text-danger" id="email-help"></p>
              </div>
              <div class="form-group">
                <label class="sr-only" for="phone">{{ site.data.sitetext[site.locale].contact.phone-label | default: "Phone" }}</label>
                <input name="phone" class="form-control" id="phone"
                  aria-describedby="phone-help" type="tel" autocomplete="tel"
                  placeholder="{{ site.data.sitetext[site.locale].contact.phone | default: "Phone Number*" }}"
                  required="required" data-validation-required-message="{{ site.data.sitetext[site.locale].contact.phone-validation | default: "Please enter your phone number." }}">
                <p class="help-block text-danger" id="phone-help"></p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label class="sr-only" for="message">{{ site.data.sitetext[site.locale].contact.message-label | default: "Message" }}</label>
                <textarea name="message" class="form-control" id="message"
                  aria-describedby="message-help"
                  placeholder="{{ site.data.sitetext[site.locale].contact.message | default: "Message*" }}"
                  required="required" data-validation-required-message="{{ site.data.sitetext[site.locale].contact.message-validation | default: "Please enter a message." }}"></textarea>
                <p class="help-block text-danger" id="message-help"></p>
              </div>
            </div>
            <input type="hidden" name="_subject" id="email-subject"
              value="{{ site.data.sitetext[site.locale].contact.subject | default: "Contact Form Submission" }}">
            <div class="clearfix"></div>
            <div class="col-lg-12 text-center">
              <div id="success" role="status" aria-live="polite"
                data-sent="{{ site.data.sitetext[site.locale].contact.sent | default: "Your message has been sent." }}"
                data-failed="{{ site.data.sitetext[site.locale].contact.failed | default: "Sorry, your message could not be sent. Please try again later." }}"></div>
              <button id="sendMessageButton" class="btn btn-primary btn-xl text-uppercase"
                type="submit">{{ site.data.sitetext[site.locale].contact.submit | default: "Send Message" }}</button>
            </div>
            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<!-- End Contact -->
