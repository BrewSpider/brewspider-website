<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C0B00">

  <!-- Title, description, canonical URL, Open Graph, X/Twitter card, structured data (jekyll-seo-tag) -->
  {% seo %}

  <!-- Fonts are self-hosted (_sass/_fonts.scss); both are used above the fold, so they load first -->
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link href="{{ '/assets/css/site.css' | relative_url }}" rel="stylesheet">

  <!-- Lets the stylesheet fold the phone menu and hold animations only when site.js will run -->
  <script>document.documentElement.classList.add("js")</script>
</head>
