<!-- Portfolio Modals -->
{% for project in site.portfolio %}
<div class="portfolio-modal modal fade" id="p{{ forloop.index }}" tabindex="-1" role="dialog" aria-hidden="true" aria-labelledby="p{{ forloop.index }}-title">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="close-modal" data-dismiss="modal">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="container">
        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="modal-body">
              <!-- Project Details Go Here -->
              <h3 class="text-uppercase" id="p{{ forloop.index }}-title">{{ project.title }}</h3>
              <p class="item-intro text-muted">{{ project.subtitle }}</p>
              <img class="img-fluid d-block mx-auto" src="{{ project.image | relative_url }}" alt="{{ project.alt }}"
                width="1080" height="1080" loading="lazy">
              {{ project.content }}
              <button class="btn btn-primary" data-dismiss="modal" type="button">
                {% include icon.html name="fas fa-xmark" %}
                {{ site.data.sitetext[site.locale].portfolio.closebutton |
                default: "Close Project" }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
<!-- End Portfolio Modals -->
