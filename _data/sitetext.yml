# English (default)
en: &DEFAULT_EN
  header:
    title: Precision Brewing Simplified
    text: Click. Brew. Cheers!
    image: assets/img/product/product.webp
    alt: "BrewSpider fermentation controller"
    button: Learn More
    buttonlink: "#features"

  features:
    title: "Features"
    text: "Temperature and pressure under control, all through fermentation"
    section: features
    list:
      - title: "Temperature Control"
        desc: "Holds your fermentation temperature by switching both a heater and a fridge, with a rest period that protects the fridge compressor. Choose the wired probe or an iSpindel as the sensor; the other one is the backup."
        icon: fas fa-temperature-high #icons in _data/icons.yml
      - title: "Pressure Control"
        desc: "A built-in spunding valve: set a target pressure and BrewSpider vents in short pulses to hold it, for naturally carbonated beer straight from the fermenter. If pressure ever nears your vessel's maximum, it vents regardless."
        icon: fas fa-gauge-high
      - title: "Control from Anywhere"
        desc: "Live readings, targets and a zoomable trend chart in the BrewSpider app on your phone, or in any web browser. Every fermentation is saved as a batch you can look back on or export as CSV."
        icon: fas fa-mobile-screen-button
      - title: "Connects to [***iSpindel***](https://ispindel.de)"
        desc: "Your [**iSpindel**](https://ispindel.de) wireless hydrometer connects straight to BrewSpider, so you follow gravity, temperature and battery in the app, without extra hardware."
        icon: fas fa-vial
      - title: "Keeps Working Offline"
        desc: "All control runs on the device itself. If your Wi-Fi or internet drops, BrewSpider keeps regulating, stores its readings and sends them once it is back online."
        icon: fas fa-shield-halved
      - title: "Easy Setup"
        desc: "Scan the QR code on the label with the app, hold the button for 5 seconds, and the app connects BrewSpider to your Wi-Fi over Bluetooth. Updates arrive over the air."
        icon: fas fa-qrcode

  portfolio:
    title: "Updates"
    text: ""
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "How it works"
    text: "From unboxing to your first batch"
    section: timeline
    # left is the default
    # start_align: "left"
    events:
      - title: "Set up your fermenter"
        year: ""
        desc: "Place **BrewSpider** next to your fermenter. Fit the temperature probe, the pressure sensor and the valve to the fermenter, and connect your heater and fridge."
        image: assets/img/timeline/brewery_setup.webp
        alt:
      - title: "Connect it to Wi-Fi"
        year: ""
        desc: "Get the BrewSpider app, choose **Pair with QR code** and scan the label. Hold the button for 5 seconds and pick your Wi-Fi; the app does the rest over Bluetooth. No phone at hand? The device also has its own Wi-Fi setup page."
        image: assets/img/timeline/wifi.webp
        alt:
      - title: "Connect your iSpindel"
        year: ""
        desc: 'Optional. In the **iSpindel** setup page choose the Wi-Fi network **BrewSpider-XXXX** (password on the label), Service Type **HTTP**, Server Address **192.168.4.1**, Port **80**, Path **/ispindel**. Then add it under Wireless sensors in the app.'
        image: assets/img/timeline/ispindel.webp
        alt:
      - title: "Set your targets"
        year: ""
        desc: "Enter the temperature and pressure you want. Brewing starts as a new batch, named however you like."
        image: assets/img/timeline/phone_app.webp
        alt:
      - title: "Monitor & adjust"
        year: ""
        desc: "Follow temperature, pressure and gravity live, from anywhere. Change targets on the fly, or take over the heater, fridge and valve by hand in manual mode."
        image: assets/img/timeline/monitor.webp
        alt:
      - title: "Keep your data"
        year: ""
        desc: "Each batch keeps its readings and events. Look back at its chart, or export to CSV for your brewing software. Sending data to <a target='_blank' rel='noopener' href='https://brewfather.app/?via=494298'><img src='assets/img/clients/brewfather.png' height='35' alt='Brewfather'></a> is coming."
        image: assets/img/timeline/integrate.webp
        alt:
        # you can enforce the alignment
        # align: right
    end: "<br> Cheers!"

  about:
    title: "About Us"
    text: "Our story"
    body: "BrewSpider is a small controller that handles both temperature and pressure during fermentation, made for homebrewers and small breweries. We design the electronics, the firmware and the app ourselves, with safety first: the device keeps your brew under control even when the internet doesn't."
    section: about

  team:
    title: "Our Team"
    text: "The people behind BrewSpider"
    subtext: Nader builds the hardware, firmware and app; Roman brings the brewing experience and keeps an eye on what brewers actually need.
