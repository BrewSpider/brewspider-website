<head>
  {% if site.analytics.google %}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "{{ site.analytics.google }}");
  </script>
  <!-- End Google Analytics -->
  {% endif %}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#212529">

  <!-- Title, description, canonical URL, Open Graph, X/Twitter card, structured data (jekyll-seo-tag) -->
  {% seo %}

  <!-- Bootstrap core CSS -->
  <link href="{{ '/assets/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">

  <!-- Fonts (one request; Droid Serif was retired by Google, Noto Serif is its successor) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Nova+Round&family=Roboto+Slab:wght@100;400;700&display=swap" rel="stylesheet">

  <!-- Custom styles for this theme -->
  <link href="{{ '/assets/css/agency.css' | relative_url }}" rel="stylesheet">

  {% if page.layout == "home" %}
  <!-- Hero background: start downloading before the stylesheet asks for it -->
  <link rel="preload" as="image" href="{{ '/assets/img/header-mobile.webp' | relative_url }}" media="(max-width: 767px)">
  <link rel="preload" as="image" href="{{ '/assets/img/header.webp' | relative_url }}" media="(min-width: 768px)">
  {% endif %}

  <!-- Page container change top padding when nav shrinks -->
  {% if page.layout == "page" %}
  <style>
    #pagecontainer {
      padding-top: 150px;
    }
    @media only screen and (max-width: 991px) {
      #pagecontainer {
        padding-top: 100px;
      }
    }
  </style>
  {% endif %}
</head>
