# All the site's wording, so text edits don't touch the templates.
# Use: {{ site.data.sitetext[site.locale].<section>.<key> }}
# Icons (the "icon" keys) are named in _data/glyphs.yml.
#
# No price and no launch date anywhere. Facts that are not settled yet are commented
# out (search for "TO CONFIRM"); don't publish them with placeholders in brackets.

# English (default)
en: &DEFAULT_EN
  hero:
    badge: "Wireless fermentation controller"
    title: "Temperature and pressure, held steady for every batch."
    slogan: "Click. Brew. Cheers!"
    text: "BrewSpider switches your heater and fridge through wireless smart plugs, holds pressure with a built-in spunding valve, reads floating sensors like the iSpindel, and keeps working when the Wi-Fi doesn't."
    note: "One email when pre-orders open. No spam."
    more:
      title: "See how it works"
      url: "#how"
    image: assets/img/product/product.webp
    image_width: 510
    image_height: 383
    alt: "The BrewSpider controller, an orange enclosure with a rounded corner"
    # Background photo (the original site banner), dimmed behind the hero
    banner: assets/img/hero/banner.webp
    banner_mobile: assets/img/hero/banner-mobile.webp
    card:
      name: "Fermenter 1"
      status: "Live"
      label: "Example readings"
      readings:
        - value: "12.3°"
          label: "target 12.0"
        - value: "0.99"
          label: "bar"
        - value: "1.042"
          label: "gravity"

  # Launch-list form (hero and bottom band). Netlify form name: launch-list.
  launch:
    label: "Email address"
    placeholder: "you@example.com"
    button: "Get launch updates"
    sent: "Thanks! You're on the list. We'll email you when pre-orders open."
    failed: "Sorry, that didn't work. Please try again, or email contact@brewspider.com."

  highlights:
    label: "Highlights"
    list:
      - icon: shield
        text: "Control runs on the device"
      - icon: wireless
        text: "Wireless plugs, fewer cables"
      - icon: flask
        text: "Floating sensors like the iSpindel"
      - icon: arrow
        text: "Sends to Brewfather, Brewer's Friend, Grainfather"
      - icon: refresh
        text: "Updates over the air"

  system:
    eyebrow: "One box for the whole fermentation"
    title: "Sensors in, heater, fridge and valve out."
    text: "BrewSpider reads the temperature and pressure in your fermenter and decides, on the device itself, when to heat, cool or vent. Only the parts on the fermenter have cables, and they run on 12 V. The heater, the fridge and the floating sensor connect without wires."
    wired: "Wired"
    wireless: "Wireless"
    # Numbers match the markers on the photo; x/y = marker position on the photo in %.
    inputs_label: "What BrewSpider reads"
    inputs:
      - icon: thermometer
        title: "Temperature probe"
        text: "In the thermowell or taped to the fermenter"
        link: wired
        x: 57
        y: 66
      - icon: gauge
        title: "Pressure sensor"
        text: "On the gas side of the lid"
        link: wired
        x: 44
        y: 73
      - icon: hydrometer
        title: "Floating sensor (optional)"
        text: "Like the iSpindel: gravity, temperature, battery"
        link: wireless
        x: 26
        y: 63
    image: assets/img/product/device-with-ispindel.webp
    image_width: 480
    image_height: 480
    alt: "BrewSpider controller with its temperature probe, pressure sensor, vent valve and an iSpindel, numbered as in the list"
    caption: "The BrewSpider controller. Decides locally, works offline."
    outputs_label: "What BrewSpider switches"
    outputs:
      - icon: valve
        title: "Vent valve"
        text: "Holds pressure with short pulses, closed without power"
        link: wired
        x: 87
        y: 76
      - plug: heat
        title: "Heating smart plug"
        text: "Your heater plugs into it"
        link: wireless
      - plug: cool
        title: "Cooling smart plug"
        text: "Your fridge plugs into it, compressor rest built in"
        link: wireless

  features:
    - visual: temperature
      title: "Temperature control"
      text: "Heats and cools to your target through two wireless smart plugs, with a rest period that protects the fridge compressor. Choose the wired probe or a floating sensor like the iSpindel; the other one is the backup."
      chart_label: "target"
    - visual: pressure
      title: "Pressure control"
      text: "A built-in spunding valve: set a target and BrewSpider vents in short pulses to hold it, for naturally carbonated beer straight from the fermenter. Near your vessel's maximum it vents regardless."
    - visual: offline
      title: "Keeps working offline"
      text: "All control runs on the device. If your Wi-Fi or internet drops, BrewSpider keeps regulating, stores its readings and sends them once it is back online."
      chip: "Still regulating"
      chip_note: "Readings saved, sent later"

  app:
    eyebrow: "The BrewSpider app"
    title: "Every batch, live on your phone."
    text: "Live readings, targets and a zoomable trend chart on Android, or in any web browser. iOS is on the way."
    image: assets/img/product/app-status.webp
    image_width: 600
    image_height: 1298
    alt: "BrewSpider app status screen: heater off, cooling, valve closed, temperature 13.0 and 12.3 °C, pressure 0.99 bar, gravity 1.042"
    points:
      - title: "Batches you can look back on"
        text: "Each fermentation keeps its readings and events. Export any batch as CSV."
      - title: "Manual mode"
        text: "Take over the heater, fridge and valve by hand when you need to."
      - title: "Your own gauge as reference"
        text: "Calibrate the pressure sensor against the gauge you trust."
      - title: "Safe updates"
        text: "New firmware installs from the app, never mid-batch unless you say so."

  how:
    eyebrow: "How it works"
    title: "From unboxing to your first batch"
    steps:
      - title: "Fit it to your fermenter"
        icon: wrench
        text: "Fit the temperature probe, pressure sensor and valve. Plug your heater and fridge into the wireless smart plugs."
      - title: "Scan the label"
        icon: qr
        text: "In the app, choose Pair with QR code, hold the button for 5 seconds and pick your Wi-Fi. The app does the rest over Bluetooth."
      - title: "Set your targets"
        icon: sliders
        text: "Enter the temperature and pressure you want. Brewing starts as a new batch, named however you like."
    # TO CONFIRM: the manual's public URL. Shown under the steps once set.
    # more:
    #   text: "Adding an iSpindel or a brewing app?"
    #   link: "Step-by-step in the manual"
    #   url: ""

  apps:
    title: "Already plan your brews somewhere else?"
    text: "Connect your brewing app in the BrewSpider app: copy the link your brewing app gives you and paste it in. From then on our server sends it your readings (temperature, pressure, gravity and iSpindel battery) on its own, so your brew log fills itself."
    more: "How to connect each app"
    more_url: /brewing-apps/
    list:
      - name: "Brewfather"
        url: https://brewfather.app/?via=494298
        logo: assets/img/clients/brewfather.webp
        logo_width: 199
        logo_height: 50
        show_name: false
        rate: "Every 15 minutes, the most Brewfather accepts"
      - name: "Brewer's Friend"
        url: https://www.brewersfriend.com/
        logo: assets/img/clients/brewersfriend.webp
        logo_width: 54
        logo_height: 56
        show_name: true
        rate: "Every 15 minutes, the most Brewer's Friend accepts"
      - name: "Grainfather"
        url: https://grainfather.com/
        logo: assets/img/clients/grainfather.webp
        logo_width: 123
        logo_height: 56
        show_name: false
        rate: "Every 15 minutes"
      - name: "Webhook"
        url: /brewing-apps/#webhook
        icon: arrow
        show_name: true
        rate: "Any other app (Home Assistant, Node-RED, Google Sheets): every 1 to 60 minutes, you choose"

  about:
    eyebrow: "Who makes it"
    title: "Built by a brewer and an engineer."
    text: "We design the electronics, the firmware and the app ourselves, with safety first: the device keeps your brew under control even when the internet doesn't."
    people:
      - name: "Nader A."
        role: "Hardware, firmware and app"
        image: assets/img/team/1.jpg
      - name: "Roman D."
        role: "Brewmaster, keeps it practical"
        image: assets/img/team/2.jpg

  # Path to release: no dates (no launch date anywhere). status: done, now or next.
  roadmap:
    eyebrow: "Path to release"
    title: "Where BrewSpider is now."
    text: "No dates yet, just the order we are working in. Sign up below to hear when it moves."
    labels:
      done: "Done"
      now: "In progress"
      next: "Next"
    steps:
      - status: done
        title: "Working prototype"
        text: "Temperature and pressure control, tested in a real fermentation with a brewer."
      - status: done
        title: "App for Android and the web"
        text: "Live readings, batches, manual mode, calibration and updates over the air."
      - status: done
        title: "Brewing apps"
        text: "Readings sent to Brewfather, Brewer's Friend, Grainfather or any webhook."
      - status: now
        title: "Production hardware"
        text: "The circuit board we will build BrewSpider on, designed for manufacturing."
      - status: next
        title: "Safety testing and CE marking"
        text: "Checked against the EU rules before anything is sold."
      - status: next
        title: "Pre-orders open"
        text: "Everyone on the launch list hears first."

  faq:
    title: "Questions brewers ask"
    items:
      - q: "Does it need the internet to work?"
        a: "No. Temperature and pressure control run on the device. Without Wi-Fi it keeps regulating and stores its readings, then sends them when it is back online."
        open: true
      # TO CONFIRM: which smart plugs are supported.
      # - q: "Which heaters and fridges work?"
      #   a: "Anything you can plug into a supported smart plug: ..."
      # TO CONFIRM: the valve's fitting size.
      # - q: "Which fermenters can use pressure control?"
      #   a: "Pressure-rated fermenters with a ... port. You enter your vessel's maximum pressure, and BrewSpider vents before it gets there."
      - q: "Do I need an iSpindel?"
        a: "No. The wired probe is enough for temperature control. An iSpindel adds gravity and battery readings, and can be the main temperature sensor."
      - q: "When can I buy one?"
        a: "We are preparing pre-orders. Leave your email below and you will be the first to know."

  signup:
    title: "Be first in line."
    text: "One email when pre-orders open, and the occasional build update. Unsubscribe any time."
    more: "Questions?"
    more_link: "Send us a message"
    more_url: /contact/

  # Contact page (/contact/). Netlify form name: contact-brewspider (don't rename it:
  # Netlify keeps the submissions under that name).
  contact:
    title: "Contact us"
    text: "Questions, ideas, or want to hear when BrewSpider is available? Send us a message."
    name: "Name"
    email: "Email"
    phone: "Phone number"
    optional: "(optional)"
    message: "Message"
    subject: "Contact Form Submission"
    submit: "Send message"
    sent: "Your message has been sent. We'll get back to you soon."
    failed: "Sorry, your message could not be sent. Please try again later or email contact@brewspider.com."

  not_found:
    title: "Page not found"
    text: "The page you were looking for isn't here."
    link: "Back to the home page"

  footer:
    tagline: "Click. Brew. Cheers!"
    links:
      # TO CONFIRM: the manual's public URL.
      # - title: "Manual"
      #   url: ""
      - title: "Contact"
        url: /contact/
      - title: "Privacy"
        url: /legal
      - title: "Instagram"
        url: https://www.instagram.com/brewspider/
      - title: "Facebook"
        url: https://www.facebook.com/BrewSpider
      - title: "LinkedIn"
        url: https://www.linkedin.com/company/brewspider/
      - title: "X"
        url: https://twitter.com/Brew_Spider
    # TO CONFIRM: company name and organisation number, once registered.
    # company: ""
en-US:
  <<: *DEFAULT_EN
