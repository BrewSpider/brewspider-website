<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

    {% if site.analytics.cloudflare_token and site.analytics.cloudflare_token != "" %}
    <!-- Cloudflare Web Analytics: cookie-free, no personal data stored -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.analytics.cloudflare_token }}"}'></script>
    {% endif %}
  </body>
</html>
